version: '3.8'

services:
  # ==========================================
  # 1. Cơ sở dữ liệu mẫu (PostgreSQL Database)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: sample-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ==========================================
  # 2. Bộ nhớ đệm mẫu (Redis Cache)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: sample-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ==========================================
  # 3. Backend Service mẫu (API Gateway / Core)
  # ==========================================
  api-gateway:
    build:
      context: ./code/backend/api-gateway
      dockerfile: Dockerfile
    container_name: sample-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/app_db
      - SPRING_DATASOURCE_USERNAME=app_user
      - SPRING_DATASOURCE_PASSWORD=app_password
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      - postgres
      - redis

  # ==========================================
  # 4. Frontend Application mẫu (React + Vite)
  # ==========================================
  frontend:
    build:
      context: ./code/frontend
      dockerfile: Dockerfile
    container_name: sample-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

# ==========================================
# Volumes lưu trữ dữ liệu
# ==========================================
volumes:
  postgres_data:
  redis_data:
