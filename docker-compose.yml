services:

  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: makeup-postgres:latest
    container_name: makeup-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
      POSTGRES_DB: makeup_platform_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d makeup_platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
    image: makeup-redis:latest
    container_name: makeup-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
