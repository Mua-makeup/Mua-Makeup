name: CI

on:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'
      - 'bugfix/**'
      - develop
      - main
  pull_request:
    types: [opened, reopened]
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: code/backend/core-api
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            code/backend/core-api/*.gradle
            code/backend/core-api/gradle.properties
            code/backend/core-api/gradle/wrapper/gradle-wrapper.properties

      - name: Run all backend tests
        run: bash ./gradlew test integrationTest jacocoTestReport --continue --no-daemon --console=plain

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            code/backend/core-api/build/reports/tests/test/
            code/backend/core-api/build/test-results/test/*.xml
            code/backend/core-api/build/reports/tests/integrationTest/
            code/backend/core-api/build/test-results/integrationTest/*.xml
            code/backend/core-api/build/reports/jacoco/test/
          retention-days: 14

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build
