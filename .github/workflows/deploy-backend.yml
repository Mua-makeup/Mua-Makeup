name: Deploy Backend to VPS (CI/CD)

on:
  push:
    branches:
      - main
    paths:
      - 'code/backend/**'
      - 'docker/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 4. Build and push Backend Docker Image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./code/backend/core-api
          file: ./code/backend/core-api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/makeup-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 5. Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            mkdir -p ~/mua-makeup
            cd ~/mua-makeup

            # Login Docker Hub on VPS to pull private/public image
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            export BACKEND_IMAGE=${{ secrets.DOCKER_USERNAME }}/makeup-backend:latest
            docker compose -f docker-compose.prod.yml pull core-api
            docker compose -f docker-compose.prod.yml up -d --remove-orphans core-api
            docker image prune -f
