name: Deploy Backend to VPS (CI/CD)

on:
  push:
    branches:
      - main
    paths:
      - 'code/backend/**'
      - 'docker/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cấp quyền thực thi cho TẤT CẢ gradlew
        run: |
          find . -name "gradlew" -exec chmod +x {} +

      - name: Chạy Unit Tests & Build file .jar
        run: |
          cd code/backend/core-api
          ./gradlew test bootJar --no-daemon

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build và Push Docker Images lên Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./code/backend/core-api
          file: ./code/backend/core-api/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/makeup-backend:latest

  deploy-to-vps:
    name: deploy-to-vps
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            mkdir -p ~/mua-makeup
            cd ~/mua-makeup

            # Đăng nhập Docker Hub trên VPS để kéo image
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            export BACKEND_IMAGE=${{ secrets.DOCKER_USERNAME }}/makeup-backend:latest
            docker compose -f docker-compose.prod.yml pull core-api
            docker compose -f docker-compose.prod.yml up -d --remove-orphans core-api
            docker image prune -f
