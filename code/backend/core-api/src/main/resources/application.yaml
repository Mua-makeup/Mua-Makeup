server:
  port: 8080

spring:
  application:
    name: core-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/makeup_platform_db?currentSchema=public,auth_schema,agency_schema,mua_schema,catalog_schema,booking_schema,telemetry_schema,wallet_schema,interaction_schema
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET:MakeupBookingPlatformLayeredMonolithSecretKey2026MustBeSecureLongKey!}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:7200000} # 2 hours
  refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30} # 30 days
