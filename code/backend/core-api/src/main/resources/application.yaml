server:
  port: 8080

spring:
  application:
    name: core-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/makeup_platform_db?currentSchema=public,auth_schema,agency_schema,mua_schema,catalog_schema,booking_schema,telemetry_schema,wallet_schema,interaction_schema
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    validate-on-migrate: false
    locations: classpath:db/migration
  data:
    web:
      pageable:
        page-serialization-mode: via-dto
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET:MakeupBookingPlatformLayeredMonolithSecretKey2026MustBeSecureLongKey!}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:86400000} # 24 hours (1 day)
  refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30} # 30 days
  cookie-secure: ${JWT_COOKIE_SECURE:false} # Set to true in production (HTTPS)

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${CLOUDINARY_API_KEY:demo}
  api-secret: ${CLOUDINARY_API_SECRET:demo}

app:
  maps:
    goong:
      api-key: ${GOONG_API_KEY:dummy_goong_key}
      base-url: ${GOONG_BASE_URL:https://rsapi.goong.io}

