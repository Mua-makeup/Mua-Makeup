spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:makeup_platform_db}?currentSchema=public,auth_schema,agency_schema,mua_schema,catalog_schema,booking_schema,telemetry_schema,wallet_schema,interaction_schema}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  # Trong production (VPS / Railway): bắt buộc HTTPS và SameSite=None để Vercel nhận cookie
  cookie-secure: ${JWT_COOKIE_SECURE:true}
  cookie-same-site: ${JWT_COOKIE_SAME_SITE:None}
