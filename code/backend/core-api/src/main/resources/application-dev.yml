spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:makeup_platform_db}?currentSchema=public,auth_schema,agency_schema,mua_schema,catalog_schema,booking_schema,telemetry_schema,wallet_schema,interaction_schema
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 50
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  # Hỗ trợ nhận cookie cross-site khi test qua ngrok tunnel với Vercel
  cookie-secure: ${JWT_COOKIE_SECURE:true}
  cookie-same-site: ${JWT_COOKIE_SAME_SITE:None}

payment:
  gateways:
    vnpay:
      enabled: ${VNPAY_ENABLED:true}
      tmn-code: ${VNPAY_TMN_CODE}
      hash-secret: ${VNPAY_HASH_SECRET}
      pay-url: ${VNPAY_API_URL}
      return-url: ${VNPAY_RETURN_URL}
    momo:
      enabled: ${MOMO_ENABLED:true}
      partner-code: ${MOMO_PARTNER_CODE}
      access-key: ${MOMO_ACCESS_KEY}
      secret-key: ${MOMO_SECRET_KEY}
      endpoint-url: ${MOMO_ENDPOINT}
      return-url: ${MOMO_REDIRECT_URL}
      ipn-url: ${MOMO_IPN_URL}
