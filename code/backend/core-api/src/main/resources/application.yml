server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-swallow-size: 50MB

spring:
  application:
    name: core-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 100MB
  data:
    web:
      pageable:
        page-serialization-mode: via-dto
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    validate-on-migrate: false
    locations: classpath:db/migration
  mail:
    host: smtp.gmail.com
    port: 587
    username: trung8d2005@gmail.com
    password: jteewzdhxwzkdsjx
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET:MakeupBookingPlatformLayeredMonolithSecretKey2026MustBeSecureLongKey!}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:86400000} # 24 hours
  refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7} # 30 days
  cookie-secure: ${JWT_COOKIE_SECURE:false}
  cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${CLOUDINARY_API_KEY:demo}
  api-secret: ${CLOUDINARY_API_SECRET:demo}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  maps:
    goong:
      api-key: ${GOONG_API_KEY:dummy_goong_key}
      base-url: ${GOONG_BASE_URL:https://rsapi.goong.io}

